name: Deploy to EdgeOne

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight deployment finish before starting another one.
concurrency:
  group: edgeone-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGEONE_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Check resource budget
        run: |
          node scripts/resource-budget.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { targets } = JSON.parse(fs.readFileSync('delivery/resource-budget.json', 'utf8'));
          if (!targets.firstScreenPass || !targets.fullPublishedPass) {
            throw new Error('Resource budget exceeded');
          }
          NODE

      - name: Install EdgeOne CLI
        run: npm install --global edgeone@1.6.41

      - name: Skip superseded commits
        id: latest
        shell: bash
        run: |
          latest_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer master commit exists; skipping this deployment.'
          fi

      - name: Deploy to EdgeOne production
        if: steps.latest.outputs.deploy == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$EDGEONE_API_TOKEN" ]]; then
            echo '::error::Add the EDGEONE_API_TOKEN repository secret in Settings > Secrets and variables > Actions.'
            exit 1
          fi
          edgeone makers deploy ./dist \
            --name "$EDGEONE_PROJECT_NAME" \
            --token "$EDGEONE_API_TOKEN" \
            --env production
